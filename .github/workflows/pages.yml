name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on via the API if it is not already
      # configured, so the deploy does not need a manual Settings visit.
      # It still requires a public repo on free accounts.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is static and served from the repo root. The original
      # screenshots are source-of-truth only and would add ~4 MB to the
      # upload, so they are left out of the artifact.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/
          mkdir -p _site/assets
          cp assets/favicon.svg _site/assets/
          cp -r assets/img _site/assets/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
