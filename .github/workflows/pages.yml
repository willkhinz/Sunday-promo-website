name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on via the API if it is not already
      # configured, so the deploy does not need a manual Settings visit.
      # It still requires a public repo on free accounts.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is static and served from the repo root. The original
      # screenshots are source-of-truth only and would add ~4 MB to the
      # upload, so they are left out of the artifact.
      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp index.html robots.txt sitemap.xml _site/
          cp -r css js _site/
          cp -r assets/img assets/video _site/assets/
          touch _site/.nojekyll

      # Every local path any staged page references must exist in the tree.
      # Without this a renamed or deleted asset ships as a 404.
      - name: Verify staged assets
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          site = pathlib.Path("_site")
          missing, total = [], 0
          for page in sorted(site.glob("*.html")):
              refs = sorted(set(re.findall(
                  r'(?:src|href)="((?!https?:|#|mailto:|data:)[^"]+)"',
                  page.read_text())))
              total += len(refs)
              missing += [f"{page.name} -> {r}" for r in refs if not (site / r).exists()]
          print(f"checked {total} referenced assets across {len(list(site.glob('*.html')))} pages")
          if missing:
              print("MISSING FROM BUILD:", *missing, sep="\n  ")
              sys.exit(1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
